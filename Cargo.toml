[workspace]
members = ["crates/proxsep-core", "crates/proxsep-protocol", "crates/proxsep-command", "crates/proxsep-cli", "crates/proxsep-desktop", "crates/proxsep-driver", "crates/proxsep-mcp", "crates/proxsep-runtime", "crates/proxsep-service"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
quick-xml = { version = "0.38", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "rt-multi-thread", "time", "sync", "signal"] }
xmltree = "0.11"
